<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LESNOY · Маркетинг · ежемесячный отчёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  LESNOY · Ежемесячный маркетинговый отчёт.
  Приложение рендерит отчёт из данных месяца (JSON).
  Без ключей Supabase работает демо-режим из сида (seed.js).
  Дизайн и структура — по утверждённому макету (maket.html), не менять без запроса.
-->
<style>
  :root{
    --canopy:#152820; --canopy-2:#1E3A2C;
    --paper:#F4F1E6; --card:#FFFFFF;
    --ink:#20281F; --ink-soft:#5C6657; --line:#DDD8C6;
    --moss:#3E6B4F;
    --amber:#C98A2D; --amber-soft:#F3E4C8;
    --fir:#2E6E6A;  --fir-soft:#D8E8E4;
    --good:#3E7A4C; --bad:#A6432F;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

  /* ==== ШАПКА ==== */
  header{background:radial-gradient(ellipse 120% 90% at 50% -20%, var(--canopy-2), var(--canopy) 70%);color:#EDEAD9;padding:48px 24px 0;position:relative;overflow:hidden}
  header .rings{position:absolute;inset:auto -140px -260px auto;width:560px;height:560px;opacity:.14;pointer-events:none}
  .head-inner{max-width:1060px;margin:0 auto;position:relative}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .brand h1{font-family:'Prata',serif;font-weight:400;font-size:clamp(30px,5vw,48px);letter-spacing:.14em}
  .brand .division{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#B9C4AE}
  .period{margin-top:18px;display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#E4D9B8}
  .period::before{content:'';width:34px;height:1px;background:#E4D9B8;opacity:.6}

  nav{max-width:1060px;margin:26px auto 0;display:flex;gap:6px}
  .tab-btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:14px 26px;border-radius:12px 12px 0 0;background:rgba(244,241,230,.10);color:#D8DCC8;transition:background .2s,color .2s}
  .tab-btn:hover{background:rgba(244,241,230,.20)}
  .tab-btn:focus-visible{outline:2px solid #E4D9B8;outline-offset:-2px}
  .tab-btn.active{background:var(--paper);color:var(--ink)}
  .tab-btn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .dot-sum{background:var(--moss)} .dot-tas{background:var(--amber)} .dot-bis{background:var(--fir)}

  /* ==== ПАНЕЛЬ УПРАВЛЕНИЯ ==== */
  .toolbar{max-width:1060px;margin:0 auto;padding:18px 24px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar select,.toolbar button{font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .toolbar button:hover:not(:disabled){border-color:var(--moss)}
  .toolbar button:disabled{opacity:.45;cursor:not-allowed}
  .toolbar .ghost{background:transparent}
  .toolbar .spacer{flex:1}
  .status{width:100%;font-size:12px;color:var(--ink-soft)}
  .status .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:#E4E1D3;color:#5C6657;margin-right:8px}

  main{max-width:1060px;margin:0 auto;padding:26px 24px 80px}
  .panel{display:none}
  .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.panel.active{animation:none}}

  h2.section{font-family:'Prata',serif;font-weight:400;font-size:24px;margin:44px 0 6px;display:flex;align-items:center;gap:12px}
  h2.section:first-child{margin-top:0}
  h2.small{font-size:19px}
  h2.section::after{content:'';flex:1;height:1px;background:var(--line)}
  .section-note{font-size:13px;color:var(--ink-soft);margin-bottom:18px}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 16px}
  .metric .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .metric .value{font-size:28px;font-weight:700;margin-top:6px;line-height:1.1}
  .metric .value .unit{font-size:15px;font-weight:500;color:var(--ink-soft);margin-left:2px}
  .metric .delta{font-size:13px;margin-top:6px;font-weight:600}
  .metric .note{font-size:12px;margin-top:6px;color:var(--ink-soft);font-weight:500;line-height:1.4}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-soft);font-weight:500}
  .metric.hero{border-top:3px solid var(--moss)}
  .tashkent .metric.hero{border-top-color:var(--amber)}
  .bishkek .metric.hero{border-top-color:var(--fir)}

  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
  th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:14px 16px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 16px;border-bottom:1px solid #EEEADD;vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.n{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.total td{font-weight:700;background:#FAF8EF}
  .camp-name{font-weight:600}
  .camp-tag{font-size:12px;color:var(--ink-soft);display:block;margin-top:2px}

  .bar{height:8px;border-radius:4px;background:#EAE6D6;overflow:hidden;margin-top:8px}
  .bar>span{display:block;height:100%;border-radius:4px;background:var(--moss)}
  .tashkent .bar>span{background:var(--amber)}
  .bishkek .bar>span{background:var(--fir)}

  .findings{display:grid;gap:12px;margin-top:16px}
  .finding{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--moss);border-radius:10px;padding:16px 20px;font-size:15px}
  .finding.warn{border-left-color:var(--bad)} .finding.win{border-left-color:var(--good)}
  .finding .who{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-right:8px;vertical-align:1px}
  .who.tas{background:var(--amber-soft);color:#7C5312}
  .who.bis{background:var(--fir-soft);color:#1E4A47}

  footer{max-width:1060px;margin:0 auto;padding:0 24px 40px;font-size:12px;color:var(--ink-soft)}

  /* ==== РЕЖИМ РЕДАКТИРОВАНИЯ ==== */
  .edit-input{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:14px;padding:6px 8px;border:1px solid var(--moss);border-radius:8px;background:#FDFCF7;width:100%;max-width:170px;margin-top:6px}
  .edit-input.text{font-family:'Manrope',system-ui,sans-serif}
  .edit-input.wide{max-width:100%}
  textarea.edit-input{resize:vertical;min-height:64px;line-height:1.5}
  select.edit-input{cursor:pointer;width:auto}
  table .edit-input{margin-top:0;max-width:120px}
  .row-del{border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:15px;line-height:1}
  .row-del:hover{border-color:var(--bad)}
  .row-add{border:1px dashed var(--moss);background:transparent;color:var(--moss);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;margin-top:10px}
  .row-add:hover{background:#EDEFE2}
  .edit-hint{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:500}
  .delivery-toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:14px;cursor:pointer}

  /* ==== МОДАЛЬНЫЕ ОКНА (вход, роли) ==== */
  .overlay{position:fixed;inset:0;background:rgba(21,40,32,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay[hidden]{display:none}
  .modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal h3{font-family:'Prata',serif;font-weight:400;font-size:20px;margin-bottom:6px}
  .modal-note{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .modal label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
  .modal input{width:100%;margin-top:4px;padding:9px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:#FDFCF7}
  .modal-err{font-size:13px;min-height:18px;margin-bottom:6px;color:var(--bad)}
  .modal-err.ok{color:var(--good)}
  .modal-btns{display:flex;gap:8px;flex-wrap:wrap}
  .modal-btns button{font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .modal-btns button:hover:not(:disabled){border-color:var(--moss)}
  .modal-btns button:disabled{opacity:.45;cursor:wait}
  .modal-btns .ghost{background:transparent}
  .roles-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EEEADD;font-size:14px}
  .roles-row:last-child{border-bottom:0}
  .roles-row .email{overflow-wrap:anywhere}
  .roles-row select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}

  @media (max-width:640px){
    .tab-btn{padding:12px 14px;font-size:13px}
    .metric .value{font-size:23px}
  }
</style>
</head>

<script>
"use strict";

/* ============================================================
   СОСТОЯНИЕ ПРИЛОЖЕНИЯ
   ============================================================ */
const state = {
  months: {},        // все загруженные месяцы: { '2026-06': {...} }
  current: null,     // ключ выбранного месяца
  demo: true,        // демо-режим (ключи Supabase не заданы)
  fromSeed: false,   // база пуста — показан сид как пример
  user: null,        // текущий пользователь Supabase (null = не вошёл)
  role: "viewer",    // 'viewer' | 'editor' | 'superuser'
  editing: false,    // режим редактирования
  draft: null        // черновик месяца (копия, правится инпутами)
};

let sb = null;       // клиент Supabase (null в демо-режиме)

const ROLE_LABEL = { viewer: "просмотр", editor: "редактор", superuser: "суперюзер" };

/* Ключи города → CSS-классы макета и подписи */
const CITY_META = {
  tas: { panel: "tashkent", who: "tas" },
  bis: { panel: "bishkek",  who: "bis" }
};

const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь",
                     "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

/* ============================================================
   ФОРМАТИРОВАНИЕ ЧИСЕЛ (русская локаль: пробел — тысячи, запятая — десятичные)
   ============================================================ */
const DASH = "—";

// целое: 1571255 → «1 571 255»
function fmtInt(n){
  return n == null ? DASH : Math.round(n).toLocaleString("ru-RU");
}

// доллары: 891.14 → «$891,14»
function fmtUsd(n){
  if (n == null) return DASH;
  return "$" + n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// проценты: (12.35, 2) → «12,35%»
function fmtPct(n, digits = 1){
  if (n == null) return DASH;
  return n.toLocaleString("ru-RU", { minimumFractionDigits: digits, maximumFractionDigits: digits }) + "%";
}

// крупные числа: ≥ 1 млн → «4,15 <span>млн</span>», меньше — целиком
function fmtBig(n){
  if (n == null) return DASH;
  if (n >= 1e6){
    const v = (n / 1e6).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return v + ' <span class="unit">млн</span>';
  }
  return fmtInt(n);
}

// число со знаком: 2261 → «+2 261»
function fmtSigned(n){
  if (n == null) return DASH;
  return (n > 0 ? "+" : n < 0 ? "−" : "") + fmtInt(Math.abs(n));
}

// процент со знаком: 13.0 → «+13,0%»
function fmtSignedPct(n, digits = 1){
  if (n == null) return DASH;
  return (n > 0 ? "+" : n < 0 ? "−" : "") + fmtPct(Math.abs(n), digits);
}

// сумма в местной валюте: (4066000, 'сум') → «4 066 000 сум»
function fmtLocal(n, currency){
  return n == null ? `${DASH} ${currency}` : `${fmtInt(n)} ${currency}`;
}

// склонение: (890, ["подписка","подписки","подписок"]) → «подписок»
function plural(n, forms){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b === 1) return forms[0];
  if (b >= 2 && b <= 4) return forms[1];
  return forms[2];
}

// класс дельты по знаку
function deltaClass(n){
  if (n == null || n === 0) return "flat";
  return n > 0 ? "up" : "down";
}

// экранирование пользовательского текста для вставки в HTML
function esc(s){
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============================================================
   РЕДАКТИРОВАНИЕ: ЧЕРНОВИК И ИНПУТЫ
   Каждый инпут привязан к пути в черновике (data-path),
   значение пишется в черновик прямо при вводе.
   ============================================================ */

// «1 234,56» из инпута → 1234.56; пусто → null
function parseNum(str){
  const s = String(str).trim().replace(/\s/g, "").replace(",", ".");
  if (!s || s === "—") return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}

// число → строка для инпута (запятая как в отчёте)
function numToStr(n){
  return n == null ? "" : String(n).replace(".", ",");
}

function getPath(obj, path){
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
}

function setPath(obj, path, val){
  const keys = path.split(".");
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = val;
}

// числовой инпут, привязанный к пути в черновике
function inpNum(path){
  return `<input class="edit-input" data-path="${path}" data-type="num" inputmode="decimal" value="${esc(numToStr(getPath(state.draft, path)))}">`;
}

// текстовый инпут
function inpText(path, cls = ""){
  return `<input class="edit-input text ${cls}" data-path="${path}" value="${esc(getPath(state.draft, path))}">`;
}

// карточка-метрика с инпутом (для режима редактирования)
function editCard(label, path, hint = ""){
  return `<div class="metric"><div class="label">${label}</div>${inpNum(path)}${hint ? `<div class="edit-hint">${hint}</div>` : ""}</div>`;
}

/* ============================================================
   АВТОМАТИЧЕСКИЕ РАСЧЁТЫ (спека: руками не вводятся)
   ============================================================ */

// прирост Instagram = подписки − отписки
function smmGrowth(smm){
  if (smm.follows == null || smm.unfollows == null) return null;
  return smm.follows - smm.unfollows;
}

// цена подписчика = бюджет ÷ подписки
function costPerSub(budget, subs){
  if (budget == null || !subs) return null;
  return budget / subs;
}

// безопасное деление в процентах
function pctOf(part, total, ifZero = null){
  if (part == null || !total) return ifZero;
  return part / total * 100;
}

// сумма с учётом null (все null → null)
function sumOf(values){
  const nums = values.filter(v => v != null);
  return nums.length ? nums.reduce((a, b) => a + b, 0) : null;
}

/* ============================================================
   РЕНДЕР: ОБЩИЕ КУСКИ
   ============================================================ */

function metricCard({ label, value, delta, deltaCls = "flat", note, hero = false, valueStyle = "", bar = null }){
  const deltaHtml = delta ? `<div class="delta ${deltaCls}">${delta}</div>` : "";
  const noteHtml  = note  ? `<div class="note">${note}</div>` : "";
  const barHtml   = bar   ? `<div class="bar"><span style="width:${bar.width}%${bar.bad ? ";background:var(--bad)" : ""}"></span></div>` : "";
  const style     = valueStyle ? ` style="${valueStyle}"` : "";
  return `<div class="metric${hero ? " hero" : ""}">
    <div class="label">${label}</div>
    <div class="value num"${style}>${value}</div>${barHtml}${deltaHtml}${noteHtml}
  </div>`;
}

}

// подпись кампании: ручной тег, а если его нет — авто CPC/CTR (когда есть данные)
function campaignTag(c){
  if (c.tag) return esc(c.tag);
  const cpc = (c.budget != null && c.clicks) ? c.budget / c.clicks : null;
  const ctr = pctOf(c.clicks, c.impressions);
  if (cpc == null || ctr == null) return "";
  return `CPC ${fmtUsd(cpc)} · CTR ${fmtPct(ctr, 2)}`;
}

        <td>${inpNum(cp + "reach")}</td>

    return `

      ${editCard("Клики", p + "clicks")}
      ${editCard("Подписки", p + "subs")}
      ${editCard("Визиты профиля", p + "visits")}

        <tbody>${rows || `<tr><td colspan="8" style="color:var(--ink-soft)">Кампаний пока нет</td></tr>`}</tbody>

  return `

function renderDelivery(city, ck){
  const d = city.delivery;
  if (state.editing){
    const p = `cities.${ck}.delivery.`;
    const toggle = `<label class="delivery-toggle"><input type="checkbox" data-action="delivery-toggle" data-city="${ck}"${d ? " checked" : ""}> В этом городе есть блок доставки</label>`;
    const fields = !d ? "" : `
    <div class="metric" style="margin-bottom:14px;max-width:420px">
      <div class="label">Период продвижения</div>${inpText(p + "period", "wide")}
      <div class="edit-hint">например: 27.06 — 03.07</div>
    </div>
    <div class="grid">
      ${editCard("Просмотры", p + "views")}
      ${editCard("Клики", p + "clicks")}
      ${editCard("Заказы", p + "orders")}
      ${editCard(`Выручка от продвижения, ${city.currency}`, p + "revenue")}
      ${editCard(`Затраты, ${city.currency}`, p + "costs")}
      ${editCard("Доля от выручки доставки, %", p + "promoRevenuePct", "вводится из кабинета")}
    </div>
    <p class="edit-hint">CTR, конверсия в заказ, цена заказа и ДРР считаются автоматически.</p>`;
    return `<h2 class="section">Доставка · Яндекс Еда CPA</h2>${toggle}${fields}`;
  }
  if (!d) return "";
  const ctr = pctOf(d.clicks, d.views);
  const conv = pctOf(d.orders, d.clicks);
  const costPerOrder = (d.costs != null && d.orders) ? d.costs / d.orders : null;
  const drr = pctOf(d.costs, d.revenue);
  return `
    <h2 class="section">Доставка · Яндекс Еда CPA</h2>
    <p class="section-note">Продвижение за период ${esc(d.period)}</p>
    <div class="grid">
      ${metricCard({ label: "Просмотры", value: fmtInt(d.views) })}
      ${metricCard({ label: "Клики", value: fmtInt(d.clicks),
        delta: ctr == null ? "" : `CTR ${fmtPct(ctr, 2)} — конверсия из просмотра в клик` })}
      ${metricCard({ hero: true, label: "Заказы", value: fmtInt(d.orders),
        delta: conv == null ? "" : `конверсия из клика в заказ ${fmtPct(conv, 2)}` })}
      ${metricCard({ label: "Выручка от продвижения",
        value: `${fmtInt(d.revenue)} <span class="unit">${city.currency}</span>`, valueStyle: "font-size:22px" })}
      ${metricCard({ label: "Затраты",
        value: `${fmtInt(d.costs)} <span class="unit">${city.currency}</span>`, valueStyle: "font-size:22px",
        delta: costPerOrder == null ? "" : `${fmtInt(costPerOrder)} ${city.currency} за заказ` })}
      ${metricCard({ hero: true, label: "Доля рекламных расходов (ДРР)", value: fmtPct(drr, 2),
        delta: d.promoRevenuePct == null ? "" : `${fmtPct(d.promoRevenuePct)} от выручки доставки` })}
    </div>`;
}

function renderReviews(city, ck){
  const r = city.reviews;
  if (state.editing){
    const p = `cities.${ck}.reviews.`;
    return `
    <h2 class="section">Отзывы гостей</h2>
    <p class="section-note">Проценты позитива и негатива считаются автоматически от общего числа.</p>
    <div class="grid">
      ${editCard("Всего за месяц", p + "total")}
      ${editCard("Позитив", p + "positive")}
      ${editCard("Негатив", p + "negative")}
      ${editCard("Средняя оценка", p + "avgRating", "пусто — если нет")}
    </div>
    <div class="metric" style="margin-top:14px">
      <div class="label">Комментарий к отзывам</div>
      <textarea class="edit-input text wide" data-path="${p}note">${esc(r.note)}</textarea>
      <div class="edit-hint">показывается плашкой под карточками; пусто — плашки нет</div>
    </div>`;
  }
  // проценты позитива/негатива считаются от общего числа
  const posPct = pctOf(r.positive, r.total, 0);
  const negPct = pctOf(r.negative, r.total, 0);
  return `
    <h2 class="section">Отзывы гостей</h2>
    <div class="grid">
      ${metricCard({ hero: true, label: "Всего за месяц", value: fmtInt(r.total),
        delta: r.avgRating == null ? "" : `средняя оценка ${r.avgRating.toLocaleString("ru-RU")}` })}
      ${metricCard({ label: "Позитив", value: fmtInt(r.positive), valueStyle: "color:var(--good)",
        bar: { width: posPct ?? 0 }, delta: `${fmtPct(posPct)} от всех` })}
      ${metricCard({ label: "Негатив", value: fmtInt(r.negative), valueStyle: "color:var(--bad)",
        bar: { width: negPct ?? 0, bad: true }, delta: `${fmtPct(negPct)} от всех` })}
    </div>
    ${r.note ? `<div class="finding" style="margin-top:14px">${esc(r.note)}</div>` : ""}`;
}

function renderCity(month, ck){
  const city = month.cities[ck];
  return renderSmm(city, ck) + renderPr(city, ck) + renderTarget(city, ck) + renderDelivery(city, ck) + renderReviews(city, ck);
}

/* ============================================================
   РЕНДЕР: СВОДКА (вся считается из данных городов, кроме выводов)
   ============================================================ */

function renderSummary(month){
  if (state.editing){
    const rows = month.findings.map((f, i) => `
      <div class="finding" style="display:grid;gap:8px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select class="edit-input" data-path="findings.${i}.city">
            <option value=""${!f.city ? " selected" : ""}>— без города</option>
            ${Object.entries(month.cities).map(([k, c]) =>
              `<option value="${k}"${f.city === k ? " selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select>
          <select class="edit-input" data-path="findings.${i}.tone">
            <option value=""${!f.tone ? " selected" : ""}>нейтрально</option>
            <option value="win"${f.tone === "win" ? " selected" : ""}>успех</option>
            <option value="warn"${f.tone === "warn" ? " selected" : ""}>внимание</option>
          </select>
          <span class="spacer" style="flex:1"></span>
          <button class="row-del" data-action="find-del" data-index="${i}" title="Удалить вывод">×</button>
        </div>
        <input class="edit-input text wide" data-path="findings.${i}.title" placeholder="Заголовок (выделяется жирным)" value="${esc(f.title)}">
        <textarea class="edit-input text wide" data-path="findings.${i}.text" placeholder="Текст вывода">${esc(f.text)}</textarea>
      </div>`).join("");
    return `
    <h2 class="section">Выводы месяца</h2>
    <p class="section-note">Карточки и таблица «Города рядом» считаются автоматически из вкладок городов — они обновятся после сохранения. Руками пишутся только выводы.</p>
    <div class="findings">${rows || `<div class="section-note">Выводов пока нет — добавь кнопкой ниже.</div>`}</div>
    <button class="row-add" data-action="find-add">+ Вывод</button>`;
  }

  const cities = Object.values(month.cities);
  const [tas, bis] = [month.cities.tas, month.cities.bis];

  // агрегаты по всем городам
  const followers = sumOf(cities.map(c => c.smm.followers));
  const growth    = sumOf(cities.map(c => smmGrowth(c.smm)));
  const views     = sumOf(cities.map(c => c.smm.views));
  const budget    = sumOf(cities.map(c => c.target.meta.budget));
  const subs      = sumOf(cities.map(c => c.target.meta.subs));
  const cps       = costPerSub(budget, subs);
  const withDelivery = cities.filter(c => c.delivery);
  const orders    = sumOf(withDelivery.map(c => c.delivery.orders));
  const drr       = pctOf(sumOf(withDelivery.map(c => c.delivery.costs)),
                          sumOf(withDelivery.map(c => c.delivery.revenue)));
  const revTotal  = sumOf(cities.map(c => c.reviews.total));
  const revPos    = sumOf(cities.map(c => c.reviews.positive));
  const posPct    = pctOf(revPos, revTotal);

  // карточки: порядок по спеке — СММ → таргет → доставка → отзывы
  const cards = `
    ${metricCard({ hero: true, label: "Аудитория Instagram", value: fmtInt(followers),
      delta: `${fmtSigned(growth)} за месяц`, deltaCls: deltaClass(growth) })}
    ${metricCard({ hero: true, label: "Просмотры Instagram", value: fmtBig(views),
      delta: cities.map(c => stripUnit(fmtBig(c.smm.views))).join(" + ") })}
    ${metricCard({ hero: true, label: "Бюджет таргета", value: fmtUsd(budget),
      delta: cities.map(c => `${c.name} ${fmtUsd(c.target.meta.budget)}`).join(" · ") })}
    ${metricCard({ hero: true, label: "Подписки из рекламы", value: fmtInt(subs),
      delta: cps == null ? "" : `цена подписчика ${fmtUsd(cps)}` })}
    ${orders == null ? "" : metricCard({ hero: true, label: "Заказы Яндекс Еда (CPA)", value: fmtInt(orders),
      delta: drr == null ? "" : `доля рекламных расходов ${fmtPct(drr, 2)}` })}
    ${metricCard({ hero: true, label: "Отзывы гостей", value: fmtInt(revTotal),
      delta: posPct == null ? "" : `${fmtPct(posPct)} позитивных`, deltaCls: "up" })}`;

  // таблица «Города рядом»
  const row = (label, fn) => `<tr><td>${label}</td>${cities.map(c => `<td class="n">${fn(c)}</td>`).join("")}</tr>`;
  const table = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Показатель</th>${cities.map(c => `<th>${c.name}</th>`).join("")}</tr></thead>
        <tbody>
          ${row("Аудитория Instagram", c => fmtInt(c.smm.followers))}
          ${row("Прирост за месяц", c => `${fmtSigned(smmGrowth(c.smm))} (${fmtSignedPct(c.smm.growthPct)})`)}
          ${row("Просмотры", c => fmtInt(c.smm.views))}
          ${row("Доля просмотров от рекламы", c => fmtPct(c.smm.viewsAdsPct))}
          ${row("Охваченные аккаунты", c => fmtInt(c.smm.reached))}
          ${row("Бюджет таргета", c => fmtUsd(c.target.meta.budget))}
          ${row("Подписки из рекламы", c => fmtInt(c.target.meta.subs))}
          ${row("Цена подписчика", c => {
            const v = costPerSub(c.target.meta.budget, c.target.meta.subs);
            return v == null ? DASH : fmtUsd(v);
          })}
          ${row("Отзывы: позитив / всего", c => `${fmtInt(c.reviews.positive)} / ${fmtInt(c.reviews.total)}`)}
          ${row("Доля негатива в отзывах", c => fmtPct(pctOf(c.reviews.negative, c.reviews.total)))}
        </tbody>
      </table>
    </div>`;

  // выводы месяца (пишутся руками)
  const findings = month.findings.map(f => {
    const city = f.city && month.cities[f.city];
    const who = city ? `<span class="who ${CITY_META[f.city].who}">${city.name}</span>` : "";
    const tone = f.tone === "win" ? " win" : f.tone === "warn" ? " warn" : "";
    return `<div class="finding${tone}">${who}<b>${esc(f.title)}</b> ${esc(f.text)}</div>`;
  }).join("");

  return `
    <h2 class="section">Два города за месяц</h2>
    <p class="section-note">Все цифры считаются автоматически из вкладок городов.</p>
    <div class="grid">${cards}</div>
    <h2 class="section">Города рядом</h2>
    ${table}
    <h2 class="section">Выводы месяца</h2>
    <div class="findings">${findings}</div>`;
}

// «4,15 <span class="unit">млн</span>» → «4,15 млн» (для строки-подписи)
function stripUnit(html){
  return html.replace(/<[^>]+>/g, "");
}

/* ============================================================
   РЕНДЕР: СТРАНИЦА ЦЕЛИКОМ
   ============================================================ */

function monthTitle(key){
  const [y, m] = key.split("-").map(Number);
  return `${MONTH_NAMES[m - 1]} ${y}`;
}

function render(){
  // в режиме редактирования всё рисуется из черновика
  const month = state.editing ? state.draft : state.months[state.current];
  if (!month) return;

  const cityNames = Object.values(month.cities).map(c => c.name).join(" + ");
  document.getElementById("period").textContent = `${monthTitle(state.current)} · ${cityNames}`;
  document.getElementById("summary").innerHTML = renderSummary(month);
  document.getElementById("tashkent").innerHTML = renderCity(month, "tas");
  document.getElementById("bishkek").innerHTML = renderCity(month, "bis");
  document.getElementById("footer").textContent =
    `LESNOY · FIBONACCI FAMILY · Отчёт по маркетингу за ${monthTitle(state.current).toLowerCase()} · подготовлено внутренней командой`;

  // селектор месяцев — только существующие месяцы
  const sel = document.getElementById("month-select");
  sel.innerHTML = Object.keys(state.months).sort().map(k =>
    `<option value="${k}"${k === state.current ? " selected" : ""}>${monthTitle(k)}</option>`).join("");

  renderStatus();
}

/* Статусная строка и кнопки тулбара — зависят от режима и роли */
function renderStatus(){
  const status = document.getElementById("status-line");
  const seedNote = state.fromSeed ? " В базе пока нет месяцев — показан пример из сида." : "";
  if (state.editing){
    status.innerHTML = `<span class="pill">редактирование</span>Изменения появятся у всех после «Сохранить в базу». «Отмена» — отбросить.`;
  } else if (state.demo){
    status.innerHTML = `<span class="pill">демо</span>Ключи Supabase не заданы — показаны данные из сида, сохранение недоступно. Роли: просмотр (по умолчанию) · редактор · суперюзер.`;
  } else if (!state.user){
    status.innerHTML = `<span class="pill">просмотр</span>Режим просмотра.${seedNote}`;
  } else {
    status.innerHTML = `<span class="pill">${ROLE_LABEL[state.role]}</span>${state.user.email}${seedNote}`;
  }

  const authBtn = document.getElementById("btn-auth");
  authBtn.textContent = state.user ? "Выйти" : "Войти";
  authBtn.disabled = state.demo;
  authBtn.title = state.demo ? "Недоступно в демо-режиме" : "";

  // «Роли» видит только суперюзер
  document.getElementById("btn-roles").hidden = state.role !== "superuser";

  // кнопки редактора
  const canEdit = !state.demo && (state.role === "editor" || state.role === "superuser");
  const editHint = state.demo ? "Недоступно в демо-режиме" : "Только для редакторов";
  const ed = state.editing;
  document.getElementById("month-select").disabled = ed;
  document.getElementById("btn-save").hidden = !ed;
  document.getElementById("btn-cancel").hidden = !ed;
  for (const id of ["btn-edit", "btn-add-month", "btn-del-month"]){
    const b = document.getElementById(id);
    b.hidden = ed;
    b.disabled = !canEdit;
    b.title = canEdit ? "" : editHint;
  }
}

/* ============================================================
   ТУЛБАР
   ============================================================ */

document.getElementById("month-select").addEventListener("change", e => {
  state.current = e.target.value;
  render();
});

// «Резервная копия» — все месяцы одним JSON-файлом (доступно всем)
document.getElementById("btn-backup").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state.months, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `lesnoy-marketing-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* Переключение табов */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  });
});

/* ============================================================
   РЕДАКТИРОВАНИЕ МЕСЯЦА
   ============================================================ */

document.getElementById("btn-edit").addEventListener("click", () => {
  // черновик — глубокая копия месяца; правки не видны никому до сохранения
  state.draft = JSON.parse(JSON.stringify(state.months[state.current]));
  state.editing = true;
  render();
});

document.getElementById("btn-cancel").addEventListener("click", () => {
  state.editing = false;
  state.draft = null;
  render();
});

document.getElementById("btn-save").addEventListener("click", async () => {
  const btn = document.getElementById("btn-save");
  btn.disabled = true; btn.textContent = "Сохраняю…";
  const month = state.current;
  const { error } = await sb.from("reports").upsert({ month, data: state.draft });
  btn.disabled = false; btn.textContent = "Сохранить в базу";
  if (error){
    alert("Не сохранилось: " + error.message);
    return;                       // остаёмся в редактировании, правки не потеряны
  }
  state.editing = false;
  state.draft = null;
  await loadMonths();             // перечитать базу, чтобы видеть ровно то, что сохранилось
  if (state.months[month]) state.current = month;
  render();
});

// ввод в любой инпут/селект/текстарию редактирования → сразу в черновик
for (const evt of ["input", "change"]){
  document.addEventListener(evt, e => {
    const el = e.target;
    if (!state.editing || !el.dataset || !el.dataset.path) return;
    const val = el.dataset.type === "num" ? parseNum(el.value) : el.value;
    setPath(state.draft, el.dataset.path, val);
  });
}

// кнопки добавления/удаления строк и переключатель доставки
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || !state.editing) return;
  const { action, city: ck, index } = btn.dataset;
  const city = ck ? state.draft.cities[ck] : null;
  switch (action){
    case "pr-add":  city.pr.push({ hashtag: "", reach: null, amount: null }); break;
    case "pr-del":  city.pr.splice(+index, 1); break;
    case "camp-add": city.target.campaigns.push({ name: "", tag: "", budget: null, reach: null, impressions: null, clicks: null, subs: null, visits: null }); break;
    case "camp-del": city.target.campaigns.splice(+index, 1); break;
    case "find-add": state.draft.findings.push({ city: "", tone: "", title: "", text: "" }); break;
    case "find-del": state.draft.findings.splice(+index, 1); break;
    case "delivery-toggle":
      city.delivery = city.delivery ? null
        : { period: "", views: null, clicks: null, orders: null, revenue: null, costs: null, promoRevenuePct: null };
      break;
    default: return;
  }
  render();
});

/* ============================================================
   СОЗДАНИЕ И УДАЛЕНИЕ МЕСЯЦЕВ
   ============================================================ */

// пустой месяц из структуры последнего: названия кампаний остаются, цифры пустые
function blankFromMonth(src){
  const m = JSON.parse(JSON.stringify(src));
  for (const city of Object.values(m.cities)){
    for (const k of Object.keys(city.smm)) city.smm[k] = null;
    city.pr = [];
    city.target.meta = { budget: null, reach: null, impressions: null, clicks: null, subs: null, visits: null };
    city.target.campaigns = city.target.campaigns.map(c =>
      ({ ...c, budget: null, reach: null, impressions: null, clicks: null, subs: null, visits: null }));
    if (city.delivery) city.delivery = { period: "", views: null, clicks: null, orders: null, revenue: null, costs: null, promoRevenuePct: null };
    city.reviews = { total: null, positive: null, negative: null, avgRating: null, note: "" };
  }
  m.findings = [];
  return m;
}

document.getElementById("btn-add-month").addEventListener("click", async () => {
  if (state.fromSeed){
    alert("В базе ещё нет ни одного месяца. Сначала сохрани текущий: «✎ Редактировать» → «Сохранить в базу».");
    return;
  }
  const keys = Object.keys(state.months).sort();
  const [y, m] = keys[keys.length - 1].split("-").map(Number);
  if (m >= 12){ alert("Декабрь уже есть — в этом году больше нет месяцев."); return; }
  const next = `${y}-${String(m + 1).padStart(2, "0")}`;
  if (!confirm(`Создать «${monthTitle(next)}»? Названия кампаний скопируются из последнего месяца, цифры будут пустыми.`)) return;
  const { error } = await sb.from("reports").insert({ month: next, data: blankFromMonth(state.months[keys[keys.length - 1]]) });
  if (error){ alert("Не создалось: " + error.message); return; }
  await loadMonths();
  state.current = next;
  render();
});

document.getElementById("btn-del-month").addEventListener("click", async () => {
  if (state.fromSeed){ alert("Этот месяц ещё не сохранён в базу — удалять нечего."); return; }
  if (!confirm(`Удалить «${monthTitle(state.current)}» безвозвратно? Перед удалением стоит скачать резервную копию.`)) return;
  const { error } = await sb.from("reports").delete().eq("month", state.current);
  if (error){ alert("Не удалилось: " + error.message); return; }
  await loadMonths();
  render();
});

/* ============================================================
   ВХОД И РОЛИ
   ============================================================ */

const authOverlay = document.getElementById("auth-overlay");
const authMsg = document.getElementById("auth-msg");

document.getElementById("btn-auth").addEventListener("click", async () => {
  if (state.user){
    await sb.auth.signOut();          // выход; статус обновит onAuthStateChange
    return;
  }
  authMsg.textContent = "";
  authMsg.classList.remove("ok");
  authOverlay.hidden = false;
  document.getElementById("auth-email").focus();
});

document.getElementById("auth-cancel").addEventListener("click", () => { authOverlay.hidden = true; });

// общий обработчик для «Войти» и «Зарегистрироваться»
async function authSubmit(signup){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-pass").value;
  if (!email || !password){ authMsg.textContent = "Заполни email и пароль."; return; }

  const btns = [document.getElementById("auth-login"), document.getElementById("auth-signup")];
  btns.forEach(b => b.disabled = true);
  authMsg.classList.remove("ok");
  authMsg.textContent = "…";

  const { error } = signup
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  btns.forEach(b => b.disabled = false);

  if (error){
    // самые частые ошибки — по-русски
    const map = {
      "Invalid login credentials": "Неверный email или пароль.",
      "Email not confirmed": "Email не подтверждён — проверь почту.",
      "User already registered": "Такой пользователь уже есть — попробуй войти."
    };
    authMsg.textContent = map[error.message] || `Ошибка: ${error.message}`;
    return;
  }
  if (signup){
    authMsg.classList.add("ok");
    authMsg.textContent = "Готово. Если вход не произошёл автоматически — подтверди email по письму и войди.";
    return;
  }
  authOverlay.hidden = true;
}

document.getElementById("auth-login").addEventListener("click", () => authSubmit(false));
document.getElementById("auth-signup").addEventListener("click", () => authSubmit(true));
document.getElementById("auth-pass").addEventListener("keydown", e => { if (e.key === "Enter") authSubmit(false); });

// роль текущего пользователя из базы (нет строки = просмотр)
async function fetchRole(){
  const { data, error } = await sb.rpc("get_my_role");
  state.role = (!error && data) ? data : "viewer";
}

/* ---- окно ролей (только суперюзер) ---- */

const rolesOverlay = document.getElementById("roles-overlay");
const rolesMsg = document.getElementById("roles-msg");

document.getElementById("btn-roles").addEventListener("click", async () => {
  rolesOverlay.hidden = false;
  await renderRolesList();
});
document.getElementById("roles-close").addEventListener("click", () => { rolesOverlay.hidden = true; });

async function renderRolesList(){
  const box = document.getElementById("roles-list");
  rolesMsg.textContent = "";
  box.textContent = "Загрузка…";
  const { data, error } = await sb.rpc("list_users");
  if (error){ box.textContent = ""; rolesMsg.textContent = `Не удалось загрузить список: ${error.message}`; return; }

  box.innerHTML = data.map(u => `
    <div class="roles-row">
      <span class="email">${u.email}${u.user_id === state.user.id ? " <b>(ты)</b>" : ""}</span>
      <select data-user="${u.user_id}">
        ${Object.entries(ROLE_LABEL).map(([v, label]) =>
          `<option value="${v}"${(u.role || "viewer") === v ? " selected" : ""}>${label}</option>`).join("")}
      </select>
    </div>`).join("");

  box.querySelectorAll("select").forEach(sel => {
    sel.addEventListener("change", async () => {
      const userId = sel.dataset.user;
      const role = sel.value;
      // защита от случайного снятия суперюзера с самого себя
      if (userId === state.user.id && role !== "superuser" &&
          !confirm("Ты снимаешь роль суперюзера с самого себя и потеряешь доступ к этому окну. Продолжить?")){
        await renderRolesList();
        return;
      }
      rolesMsg.textContent = "";
      const { error: err } = role === "viewer"
        ? await sb.from("user_roles").delete().eq("user_id", userId)   // просмотр = отсутствие строки
        : await sb.from("user_roles").upsert({ user_id: userId, role });
      if (err){ rolesMsg.textContent = `Не сохранилось: ${err.message}`; await renderRolesList(); return; }
      if (userId === state.user.id){ await fetchRole(); renderStatus(); }
    });
  });
}

/* ============================================================
   ЗАГРУЗКА ДАННЫХ И СТАРТ
   Ключи не вставлены → демо-режим из сида.
   ============================================================ */

// все месяцы из базы; пустая база → сид как пример
async function loadMonths(){
  const { data, error } = await sb.from("reports").select("month,data").order("month");
  if (error || !data.length){
    state.months = SEED;
    state.fromSeed = true;
    if (error) console.error("Не удалось загрузить отчёты:", error.message);
  } else {
    state.months = Object.fromEntries(data.map(r => [r.month, r.data]));
    state.fromSeed = false;
  }
  state.current = Object.keys(state.months).sort().pop();
}

async function init(){
  const keysMissing = CONFIG.SUPABASE_URL.startsWith("ВСТАВЬ") || CONFIG.SUPABASE_ANON_KEY.startsWith("ВСТАВЬ");
  state.demo = keysMissing || !window.supabase;   // нет CDN-библиотеки — тоже демо
  if (state.demo){
    state.months = SEED;
    state.current = Object.keys(SEED).sort().pop();
    render();
    return;
  }

  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

  // реагируем на вход/выход (событие INITIAL_SESSION придёт и при загрузке страницы)
  sb.auth.onAuthStateChange(async (_event, session) => {
    state.user = session ? session.user : null;
    state.role = "viewer";
    if (state.user){
      await fetchRole();
      authOverlay.hidden = true;   // вход состоялся (в т.ч. сразу после регистрации) — окно больше не нужно
    }
    renderStatus();
  });

  await loadMonths();
  render();
}

init();
</script>
